<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Iniciar Sesión | EduGestión PRO</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- FontAwesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    fontFamily: { sans: ['"Plus Jakarta Sans"', 'sans-serif'] },
                    colors: {
                        brand: {
                            500: '#6366f1',
                            600: '#4f46e5',
                            700: '#4338ca',
                            800: '#3730a3',
                            900: '#312e81',
                        }
                    }
                }
            }
        }
        function fillAndSubmit(email, pass) {
            document.getElementById('inputUsername').value = email;
            document.getElementById('inputPassword').value = pass;
            document.getElementById('loginForm').submit();
        }
    </script>
</head>
<body class="bg-slate-900 font-sans text-slate-800 antialiased min-h-screen flex items-center justify-center p-4 relative overflow-hidden">

    <!-- Glowing Background Elements -->
    <div class="absolute -top-32 -left-32 w-96 h-96 bg-brand-600/30 rounded-full blur-3xl pointer-events-none"></div>
    <div class="absolute -bottom-32 -right-32 w-96 h-96 bg-indigo-600/25 rounded-full blur-3xl pointer-events-none"></div>

    <div class="max-w-md w-full bg-white rounded-3xl shadow-2xl p-8 relative z-10 border border-slate-100">

        <!-- Logo & Header -->
        <div class="text-center mb-8">
            <div class="w-14 h-14 mx-auto rounded-2xl bg-gradient-to-tr from-brand-600 to-indigo-500 flex items-center justify-center text-white shadow-lg shadow-brand-500/30 mb-4">
                <i class="fa-solid fa-graduation-cap text-2xl"></i>
            </div>
            <h2 class="text-2xl font-extrabold text-slate-900 tracking-tight">EduGestión PRO</h2>
            <p class="text-xs text-slate-500 mt-1">Ingresa tus credenciales para acceder a tu portal</p>
        </div>

        <!-- Alert messages -->
        <div th:if="${loginError}" class="mb-5 p-3.5 rounded-xl bg-rose-50 border border-rose-200 text-rose-700 text-xs flex items-center space-x-2">
            <i class="fa-solid fa-circle-exclamation text-rose-500 text-sm"></i>
            <span th:text="${loginError}">Error de inicio de sesión</span>
        </div>

        <div th:if="${logoutSuccess}" class="mb-5 p-3.5 rounded-xl bg-emerald-50 border border-emerald-200 text-emerald-700 text-xs flex items-center space-x-2">
            <i class="fa-solid fa-circle-check text-emerald-500 text-sm"></i>
            <span th:text="${logoutSuccess}">Sesión cerrada con éxito</span>
        </div>

        <!-- Formulario Login -->
        <form id="loginForm" th:action="@{/login}" method="post" class="space-y-4">
            <div>
                <label class="block text-xs font-semibold text-slate-700 mb-1.5">Correo Electrónico Institucional</label>
                <div class="relative">
                    <span class="absolute inset-y-0 left-0 flex items-center pl-3.5 text-slate-400">
                        <i class="fa-solid fa-envelope text-sm"></i>
                    </span>
                    <input id="inputUsername" type="email" name="username" placeholder="usuario@colegio.edu" required
                           class="w-full pl-10 pr-3.5 py-2.5 rounded-xl border border-slate-300 text-sm focus:ring-2 focus:ring-brand-500 focus:border-brand-500 outline-none transition">
                </div>
            </div>

            <div>
                <label class="block text-xs font-semibold text-slate-700 mb-1.5">Contraseña</label>
                <div class="relative">
                    <span class="absolute inset-y-0 left-0 flex items-center pl-3.5 text-slate-400">
                        <i class="fa-solid fa-lock text-sm"></i>
                    </span>
                    <input id="inputPassword" type="password" name="password" placeholder="••••••••" required
                           class="w-full pl-10 pr-3.5 py-2.5 rounded-xl border border-slate-300 text-sm focus:ring-2 focus:ring-brand-500 focus:border-brand-500 outline-none transition">
                </div>
            </div>

            <button type="submit" class="w-full py-2.5 px-4 rounded-xl bg-brand-600 hover:bg-brand-500 text-white font-semibold text-sm transition shadow-md shadow-brand-600/30 flex items-center justify-center space-x-2">
                <span>Ingresar al Sistema</span>
                <i class="fa-solid fa-arrow-right text-xs"></i>
            </button>
        </form>

        <!-- Acceso Rápido / Roles Demo -->
        <div class="mt-8 pt-6 border-t border-slate-100">
            <p class="text-[11px] font-bold uppercase tracking-wider text-slate-400 text-center mb-3">Acceso Rápido con 1 Clic (Roles Demo)</p>
            <div class="grid grid-cols-3 gap-2">
                <button type="button" onclick="fillAndSubmit('admin@colegio.edu', 'admin123')"
                        class="p-2.5 rounded-xl border border-purple-200 bg-purple-50 hover:bg-purple-100 text-purple-700 text-center transition group">
                    <i class="fa-solid fa-shield-halved text-sm block mb-1"></i>
                    <span class="text-xs font-bold block">Admin</span>
                    <span class="text-[10px] text-purple-600/80 block">admin123</span>
                </button>

                <button type="button" onclick="fillAndSubmit('roberto.gomez@colegio.edu', 'prof123')"
                        class="p-2.5 rounded-xl border border-amber-200 bg-amber-50 hover:bg-amber-100 text-amber-700 text-center transition group">
                    <i class="fa-solid fa-chalkboard-user text-sm block mb-1"></i>
                    <span class="text-xs font-bold block">Profesor</span>
                    <span class="text-[10px] text-amber-600/80 block">prof123</span>
                </button>

                <button type="button" onclick="fillAndSubmit('santiago.gomez@estudiante.edu', 'est123')"
                        class="p-2.5 rounded-xl border border-blue-200 bg-blue-50 hover:bg-blue-100 text-blue-700 text-center transition group">
                    <i class="fa-solid fa-user-graduate text-sm block mb-1"></i>
                    <span class="text-xs font-bold block">Estudiante</span>
                    <span class="text-[10px] text-blue-600/80 block">est123</span>
                </button>
            </div>
        </div>

    </div>

</body>
</html>
