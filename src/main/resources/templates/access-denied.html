<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Acceso Denegado | EduGestión PRO</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- FontAwesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
</head>
<body class="bg-slate-50 text-slate-800 font-sans antialiased min-h-screen flex items-center justify-center p-4">

    <div class="max-w-md w-full bg-white rounded-3xl p-8 border border-slate-200 shadow-xl text-center">
        <div class="w-16 h-16 mx-auto rounded-2xl bg-rose-50 text-rose-600 flex items-center justify-center text-3xl mb-4 border border-rose-100">
            <i class="fa-solid fa-lock"></i>
        </div>
        <span class="inline-flex items-center px-3 py-1 rounded-full text-xs font-semibold bg-rose-50 text-rose-700 border border-rose-200 mb-3">
            Error 403 - Forbidden
        </span>
        <h2 class="text-2xl font-extrabold text-slate-900 tracking-tight">Acceso Restringido</h2>
        <p class="text-sm text-slate-500 mt-2 leading-relaxed">
            Tu rol actual no cuenta con los permisos necesarios para acceder a este portal o recurso administrativo.
        </p>

        <div class="mt-8 flex flex-col space-y-3">
            <a href="/" class="w-full py-2.5 px-4 rounded-xl bg-indigo-600 hover:bg-indigo-500 text-white font-semibold text-sm transition shadow-sm">
                <i class="fa-solid fa-house mr-1.5"></i> Volver al Inicio
            </a>
            <form th:action="@{/logout}" method="post">
                <button type="submit" class="w-full py-2.5 px-4 rounded-xl border border-slate-200 hover:bg-slate-100 text-slate-700 font-semibold text-sm transition">
                    <i class="fa-solid fa-right-from-bracket mr-1.5"></i> Cambiar de Usuario / Salir
                </button>
            </form>
        </div>
    </div>

</body>
</html>
