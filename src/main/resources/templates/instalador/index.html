<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Asistente de Instalación Inteligente | LMS</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- FontAwesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    fontFamily: { sans: ['"Plus Jakarta Sans"', 'sans-serif'] },
                    colors: {
                        brand: { 500: '#6366f1', 600: '#4f46e5', 700: '#4338ca' }
                    }
                }
            }
        }
    </script>
</head>
<body class="bg-slate-900 text-slate-100 min-h-screen py-10 px-4 flex flex-col items-center justify-center font-sans">

    <div class="max-w-2xl w-full bg-slate-950 rounded-3xl p-8 sm:p-12 border border-slate-800 shadow-2xl relative">
        
        <!-- Header -->
        <div class="text-center mb-8">
            <div class="w-16 h-16 rounded-2xl bg-gradient-to-tr from-brand-600 to-indigo-500 text-white flex items-center justify-center text-2xl mx-auto mb-3 shadow-lg shadow-brand-500/20">
                <i class="fa-solid fa-wand-magic-sparkles"></i>
            </div>
            <h1 class="text-2xl sm:text-3xl font-black text-white">Asistente de Instalación Inteligente</h1>
            <p class="text-xs text-slate-400 mt-1">Verificación automática de entorno y puesta a punto de tu academia.</p>
        </div>

        <!-- 3-Step Indicator -->
        <div class="grid grid-cols-3 gap-2 mb-8 text-center text-xs font-bold">
            <div class="p-2 rounded-xl bg-brand-600/20 text-brand-400 border border-brand-500/30">
                <span>1. Diagnóstico</span>
            </div>
            <div class="p-2 rounded-xl bg-slate-900 text-slate-400 border border-slate-800">
                <span>2. Parámetros</span>
            </div>
            <div class="p-2 rounded-xl bg-slate-900 text-slate-400 border border-slate-800">
                <span>3. Lanzamiento</span>
            </div>
        </div>

        <!-- System Diagnostics Checklist -->
        <div class="p-5 rounded-2xl bg-slate-900/80 border border-slate-800 space-y-3 mb-8 text-xs">
            <h4 class="font-extrabold uppercase tracking-wider text-slate-400 text-[11px] mb-2">Comprobaciones del Servidor:</h4>
            
            <div class="flex items-center justify-between">
                <span class="text-slate-300">Entorno Java Runtime:</span>
                <span class="text-emerald-400 font-bold flex items-center">
                    <i class="fa-solid fa-circle-check mr-1.5"></i> <span th:text="'JDK ' + ${diagnostico.javaVersion}"></span>
                </span>
            </div>

            <div class="flex items-center justify-between">
                <span class="text-slate-300">Sistema Operativo:</span>
                <span class="text-emerald-400 font-bold flex items-center">
                    <i class="fa-solid fa-circle-check mr-1.5"></i> <span th:text="${diagnostico.osName}"></span>
                </span>
            </div>

            <div class="flex items-center justify-between">
                <span class="text-slate-300">Base de Datos:</span>
                <span class="text-emerald-400 font-bold flex items-center">
                    <i class="fa-solid fa-circle-check mr-1.5"></i> <span th:text="${diagnostico.dbEstado}"></span>
                </span>
            </div>

            <div class="flex items-center justify-between">
                <span class="text-slate-300">Memoria RAM Libre / Total:</span>
                <span class="text-emerald-400 font-bold flex items-center">
                    <i class="fa-solid fa-circle-check mr-1.5"></i> <span th:text="${diagnostico.memoriaLibreMb} + ' MB / ' + ${diagnostico.memoriaTotalMb} + ' MB'"></span>
                </span>
            </div>

            <div class="flex items-center justify-between">
                <span class="text-slate-300">Capa de Seguridad:</span>
                <span class="text-emerald-400 font-bold flex items-center">
                    <i class="fa-solid fa-circle-check mr-1.5"></i> <span th:text="${diagnostico.seguridad}"></span>
                </span>
            </div>
        </div>

        <!-- Configuration Form -->
        <form th:action="@{/instalador/guardar}" method="post" class="space-y-4">
            <div>
                <label class="block text-xs font-bold text-slate-300 mb-1">Nombre de la Academia</label>
                <input type="text" name="nombreAcademia" th:value="${config.nombreAcademia}" required
                       class="w-full px-3.5 py-2.5 rounded-xl bg-slate-900 border border-slate-700 text-xs text-white outline-none focus:ring-2 focus:ring-brand-500">
            </div>

            <div>
                <label class="block text-xs font-bold text-slate-300 mb-1">Eslogan Institucional</label>
                <input type="text" name="lema" th:value="${config.lema}" required
                       class="w-full px-3.5 py-2.5 rounded-xl bg-slate-900 border border-slate-700 text-xs text-white outline-none focus:ring-2 focus:ring-brand-500">
            </div>

            <div class="grid grid-cols-2 gap-4">
                <div>
                    <label class="block text-xs font-bold text-slate-300 mb-1">Moneda Principal</label>
                    <select name="moneda" class="w-full px-3.5 py-2.5 rounded-xl bg-slate-900 border border-slate-700 text-xs text-white outline-none">
                        <option value="USD" th:selected="${config.moneda == 'USD'}">USD ($ - Dólar)</option>
                        <option value="EUR" th:selected="${config.moneda == 'EUR'}">EUR (€ - Euro)</option>
                        <option value="COP" th:selected="${config.moneda == 'COP'}">COP ($ - Peso Col)</option>
                        <option value="MXN" th:selected="${config.moneda == 'MXN'}">MXN ($ - Peso Mex)</option>
                    </select>
                </div>
                <div>
                    <label class="block text-xs font-bold text-slate-300 mb-1">Comisión Plataforma (%)</label>
                    <input type="number" step="0.1" name="comisionPlataforma" th:value="${config.comisionPlataforma}" required
                           class="w-full px-3.5 py-2.5 rounded-xl bg-slate-900 border border-slate-700 text-xs text-white outline-none focus:ring-2 focus:ring-brand-500">
                </div>
            </div>

            <button type="submit" class="w-full py-3.5 rounded-2xl bg-gradient-to-r from-brand-600 to-indigo-600 hover:from-brand-500 hover:to-indigo-500 text-white font-black text-xs shadow-xl shadow-brand-600/30 transition flex items-center justify-center space-x-2 mt-4">
                <i class="fa-solid fa-rocket"></i>
                <span>Finalizar Instalación &amp; Lanzar Academia</span>
            </button>
        </form>

    </div>

</body>
</html>
