<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 420" width="100%" height="100%">
  <defs>
    <!-- Background Gradients -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#090d16" />
      <stop offset="50%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#1e1b4b" />
    </linearGradient>

    <linearGradient id="accentGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#6366f1" />
      <stop offset="50%" stop-color="#a855f7" />
      <stop offset="100%" stop-color="#ec4899" />
    </linearGradient>

    <linearGradient id="cardGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e293b" stop-opacity="0.8" />
      <stop offset="100%" stop-color="#0f172a" stop-opacity="0.9" />
    </linearGradient>

    <linearGradient id="emeraldGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#10b981" />
      <stop offset="100%" stop-color="#059669" />
    </linearGradient>

    <!-- Filters for glows -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="60" result="blur" />
    </filter>
  </defs>

  <!-- Canvas Background -->
  <rect width="1200" height="420" fill="url(#bgGrad)" />

  <!-- Ambient Glow Orbs -->
  <circle cx="200" cy="80" r="140" fill="#4f46e5" opacity="0.35" filter="url(#glow)" />
  <circle cx="1050" cy="320" r="160" fill="#ec4899" opacity="0.25" filter="url(#glow)" />
  <circle cx="900" cy="90" r="120" fill="#06b6d4" opacity="0.2" filter="url(#glow)" />

  <!-- Grid overlay pattern -->
  <g opacity="0.06" stroke="#ffffff" stroke-width="1">
    <line x1="0" y1="70" x2="1200" y2="70" />
    <line x1="0" y1="140" x2="1200" y2="140" />
    <line x1="0" y1="210" x2="1200" y2="210" />
    <line x1="0" y1="280" x2="1200" y2="280" />
    <line x1="0" y1="350" x2="1200" y2="350" />
    <line x1="150" y1="0" x2="150" y2="420" />
    <line x1="300" y1="0" x2="300" y2="420" />
    <line x1="450" y1="0" x2="450" y2="420" />
    <line x1="600" y1="0" x2="600" y2="420" />
    <line x1="750" y1="0" x2="750" y2="420" />
    <line x1="900" y1="0" x2="900" y2="420" />
    <line x1="1050" y1="0" x2="1050" y2="420" />
  </g>

  <!-- Left Content: Title & Subtitle -->
  <g transform="translate(80, 80)">
    <!-- Pill tag -->
    <rect x="0" y="0" width="280" height="32" rx="16" fill="#312e81" stroke="#6366f1" stroke-width="1" />
    <circle cx="16" cy="16" r="5" fill="#10b981" />
    <text x="32" y="21" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="700" fill="#c7d2fe" letter-spacing="0.5">SPRING BOOT 4 + JAVA 25 ARCHITECTURE</text>

    <!-- Main Title -->
    <text x="0" y="85" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="46" font-weight="900" fill="#ffffff" letter-spacing="-1">
      Sistema Escolar &amp; <tspan fill="url(#accentGrad)">LMS Pro</tspan>
    </text>

    <!-- Description -->
    <text x="0" y="125" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="16" font-weight="400" fill="#94a3b8">
      Gestión académica institucional (Matrículas, Finanzas, Portales RBAC)
    </text>
    <text x="0" y="150" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="16" font-weight="400" fill="#94a3b8">
      y Plataforma LMS de Marca Blanca con Cursos, Quizzes, Tareas y Certificados.
    </text>

    <!-- Tech Badges row -->
    <g transform="translate(0, 190)">
      <!-- Badge 1: Spring Boot -->
      <rect x="0" y="0" width="115" height="32" rx="8" fill="#1e293b" stroke="#334155" />
      <text x="12" y="20" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="12" font-weight="600" fill="#6ee7b7">🍃 Spring Boot</text>

      <!-- Badge 2: Spring Security -->
      <rect x="125" y="0" width="130" height="32" rx="8" fill="#1e293b" stroke="#334155" />
      <text x="137" y="20" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="12" font-weight="600" fill="#93c5fd">🔒 Spring Security</text>

      <!-- Badge 3: Tailwind & Thymeleaf -->
      <rect x="265" y="0" width="145" height="32" rx="8" fill="#1e293b" stroke="#334155" />
      <text x="277" y="20" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="12" font-weight="600" fill="#c4b5fd">🎨 Tailwind + Thymeleaf</text>

      <!-- Badge 4: H2 / JPA -->
      <rect x="420" y="0" width="105" height="32" rx="8" fill="#1e293b" stroke="#334155" />
      <text x="432" y="20" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="12" font-weight="600" fill="#fde047">⚡ JPA &amp; H2 DB</text>
    </g>
  </g>

  <!-- Right Visual: Mockup Card Stack -->
  <g transform="translate(740, 60)">
    <!-- Back card -->
    <rect x="50" y="40" width="370" height="250" rx="20" fill="#1e1b4b" opacity="0.6" stroke="#4338ca" stroke-width="1" />
    
    <!-- Front card: Interactive UI Showcase -->
    <rect x="10" y="10" width="380" height="270" rx="20" fill="url(#cardGrad)" stroke="#475569" stroke-width="1.5" />
    
    <!-- Window controls -->
    <circle cx="36" cy="34" r="5" fill="#ef4444" />
    <circle cx="52" cy="34" r="5" fill="#f59e0b" />
    <circle cx="68" cy="34" r="5" fill="#10b981" />
    <rect x="95" y="26" width="180" height="16" rx="8" fill="#0f172a" />
    <text x="130" y="38" font-family="monospace" font-size="9" fill="#64748b">http://localhost:8080/lms</text>

    <!-- Mini UI Dashboard Elements -->
    <!-- Metric 1 -->
    <rect x="30" y="60" width="100" height="55" rx="12" fill="#0f172a" stroke="#334155" />
    <text x="42" y="80" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="10" fill="#94a3b8">ESTUDIANTES</text>
    <text x="42" y="103" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="18" font-weight="800" fill="#ffffff">1,420+</text>

    <!-- Metric 2 -->
    <rect x="140" y="60" width="105" height="55" rx="12" fill="#0f172a" stroke="#334155" />
    <text x="152" y="80" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="10" fill="#94a3b8">CURSOS LMS</text>
    <text x="152" y="103" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="18" font-weight="800" fill="#a855f7">24 Activos</text>

    <!-- Metric 3 -->
    <rect x="255" y="60" width="115" height="55" rx="12" fill="#0f172a" stroke="#334155" />
    <text x="267" y="80" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="10" fill="#94a3b8">VENTAS / MES</text>
    <text x="267" y="103" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="18" font-weight="800" fill="#10b981">$18,450</text>

    <!-- Course Card Preview -->
    <rect x="30" y="130" width="340" height="70" rx="14" fill="#0f172a" stroke="#334155" />
    <rect x="42" y="142" width="46" height="46" rx="10" fill="#4338ca" />
    <text x="56" y="171" font-family="sans-serif" font-size="20">☕</text>
    <text x="100" y="157" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="13" font-weight="700" fill="#ffffff">Spring Boot &amp; Microservicios</text>
    <text x="100" y="174" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="10" fill="#94a3b8">4 Módulos • Quizzes • Certificado</text>
    <rect x="300" y="148" width="58" height="24" rx="12" fill="#10b981" />
    <text x="312" y="164" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="11" font-weight="700" fill="#ffffff">$89.99</text>

    <!-- Progress Bar -->
    <rect x="30" y="215" width="340" height="42" rx="12" fill="#1e293b" />
    <text x="44" y="235" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="11" font-weight="600" fill="#cbd5e1">Progreso en Aula Virtual: 100%</text>
    <text x="280" y="235" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="11" font-weight="800" fill="#f59e0b">🏆 Certificado</text>
    <rect x="44" y="244" width="312" height="4" rx="2" fill="#334155" />
    <rect x="44" y="244" width="312" height="4" rx="2" fill="url(#emeraldGrad)" />
  </g>
</svg>
