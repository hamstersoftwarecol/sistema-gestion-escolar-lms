<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 560" width="100%" height="100%">
  <defs>
    <linearGradient id="layerGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#1e293b" />
    </linearGradient>

    <linearGradient id="blueBox" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#2563eb" />
      <stop offset="100%" stop-color="#3b82f6" />
    </linearGradient>

    <linearGradient id="purpleBox" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#7c3aed" />
      <stop offset="100%" stop-color="#9333ea" />
    </linearGradient>

    <linearGradient id="emeraldBox" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#059669" />
      <stop offset="100%" stop-color="#10b981" />
    </linearGradient>

    <linearGradient id="amberBox" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#d97706" />
      <stop offset="100%" stop-color="#f59e0b" />
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="1000" height="560" fill="#0b0f19" rx="16" />

  <!-- Title -->
  <text x="50" y="45" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="22" font-weight="800" fill="#ffffff">
    Arquitectura del Sistema en Capas (Clean &amp; Hexagonal Design)
  </text>
  <text x="50" y="68" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="12" fill="#94a3b8">
    Flujo desacoplado desde la interfaz de usuario hasta la persistencia relacional
  </text>

  <!-- Layer 1: Client & Presentation -->
  <g transform="translate(50, 95)">
    <rect width="900" height="75" rx="12" fill="url(#layerGrad)" stroke="#334155" stroke-width="1.5" />
    <rect x="15" y="15" width="200" height="45" rx="8" fill="#1e1b4b" stroke="#4f46e5" />
    <text x="35" y="42" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="13" font-weight="700" fill="#818cf8">🖥️ UI Responsiva Tailwind</text>

    <rect x="230" y="15" width="200" height="45" rx="8" fill="#1e1b4b" stroke="#4f46e5" />
    <text x="250" y="42" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="13" font-weight="700" fill="#818cf8">🍃 Plantillas Thymeleaf</text>

    <rect x="445" y="15" width="215" height="45" rx="8" fill="#1e1b4b" stroke="#4f46e5" />
    <text x="465" y="42" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="13" font-weight="700" fill="#818cf8">📱 Menú Lateral Colapsable</text>

    <rect x="675" y="15" width="210" height="45" rx="8" fill="#1e1b4b" stroke="#4f46e5" />
    <text x="695" y="42" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="13" font-weight="700" fill="#818cf8">🌐 Vistas Multi-Portal</text>
  </g>

  <!-- Down Arrows -->
  <text x="495" y="195" font-size="20" fill="#64748b" text-anchor="middle">↓</text>

  <!-- Layer 2: Security & Middleware (RBAC) -->
  <g transform="translate(50, 205)">
    <rect width="900" height="70" rx="12" fill="#1e1b4b" stroke="#6366f1" stroke-width="1.5" />
    <text x="25" y="30" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="12" font-weight="800" fill="#a5b4fc" letter-spacing="0.5">CAPA DE SEGURIDAD &amp; CONTROL DE ACCESO (SPRING SECURITY 6)</text>
    <g transform="translate(25, 38)">
      <text x="0" y="16" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="12" fill="#e2e8f0">
        🛡️ BCrypt PasswordEncoder • Middleware RBAC (ROLE_ADMIN, ROLE_PROFESOR, ROLE_ESTUDIANTE) • CSRF Protection • Session Authentication
      </text>
    </g>
  </g>

  <!-- Down Arrows -->
  <text x="495" y="300" font-size="20" fill="#64748b" text-anchor="middle">↓</text>

  <!-- Layer 3: Application & Controllers -->
  <g transform="translate(50, 310)">
    <rect width="900" height="105" rx="12" fill="url(#layerGrad)" stroke="#334155" stroke-width="1.5" />
    <text x="20" y="24" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="11" font-weight="700" fill="#94a3b8">CONTROLADORES &amp; CAPA DE SERVICIO</text>
    
    <g transform="translate(20, 36)">
      <!-- Box 1 -->
      <rect x="0" y="0" width="165" height="52" rx="8" fill="#1e293b" stroke="#3b82f6" stroke-width="1" />
      <text x="12" y="22" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="11" font-weight="700" fill="#93c5fd">Gestión Escolar</text>
      <text x="12" y="38" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="10" fill="#64748b">Matrículas &amp; Cursos</text>

      <!-- Box 2 -->
      <rect x="175" y="0" width="165" height="52" rx="8" fill="#1e293b" stroke="#10b981" stroke-width="1" />
      <text x="187" y="22" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="11" font-weight="700" fill="#6ee7b7">Gestión Financiera</text>
      <text x="187" y="38" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="10" fill="#64748b">Ingresos, Gastos, Balance</text>

      <!-- Box 3 -->
      <rect x="350" y="0" width="170" height="52" rx="8" fill="#1e293b" stroke="#f59e0b" stroke-width="1" />
      <text x="362" y="22" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="11" font-weight="700" fill="#fcd34d">Creador de Cursos</text>
      <text x="362" y="38" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="10" fill="#64748b">Módulos, Goteo, Previews</text>

      <!-- Box 4 -->
      <rect x="530" y="0" width="170" height="52" rx="8" fill="#1e293b" stroke="#ec4899" stroke-width="1" />
      <text x="542" y="22" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="11" font-weight="700" fill="#f472b6">Aula Virtual &amp; Quiz</text>
      <text x="542" y="38" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="10" fill="#64748b">Video, Evaluaciones, Tareas</text>

      <!-- Box 5 -->
      <rect x="710" y="0" width="150" height="52" rx="8" fill="#1e293b" stroke="#a855f7" stroke-width="1" />
      <text x="722" y="22" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="11" font-weight="700" fill="#d8b4fe">Marca Blanca</text>
      <text x="722" y="38" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="10" fill="#64748b">Logo, Slogan, Moneda</text>
    </g>
  </g>

  <!-- Down Arrows -->
  <text x="495" y="440" font-size="20" fill="#64748b" text-anchor="middle">↓</text>

  <!-- Layer 4: Persistence & Database -->
  <g transform="translate(50, 450)">
    <rect width="900" height="75" rx="12" fill="#042f2e" stroke="#14b8a6" stroke-width="1.5" />
    <text x="30" y="32" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="13" font-weight="800" fill="#5eead4">💾 PERSISTENCIA &amp; ALMACENAMIENTO DE DATOS</text>
    <text x="30" y="54" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="12" fill="#ccfbf1">
      Spring Data JPA (14 Repositorios tipados) • Hibernate ORM 7 • Base de datos H2 en memoria con consola web en /h2-console
    </text>
  </g>
</svg>
